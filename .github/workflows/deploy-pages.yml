name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Feature-branch trigger so the site goes live before merge; remove after merging.
      - claude/sharepoint-app-refactor-d5sios
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site (source: GitHub Actions) if it doesn't exist yet.
          enablement: true

      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/
          cp ai-strategy-socratic-sandbox.aspx _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
