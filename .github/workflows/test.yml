name: Workshop regression checks
on:
  pull_request:
  push:
    branches: [main, v2-strategy-redesign]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: python3 tests/verify_docx.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-qa-fixtures
          path: test-results/
